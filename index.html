<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neil C. Burton — Writer</title>
<meta name="description" content="Neil C. Burton writes Southern literary fiction from Tennessee.">
<style>
  @font-face {
    font-family: "Special Elite";
    src: url("fonts/SpecialElite-Regular.woff2") format("woff2");
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: #fff;
    color: #000;
    font-family: "Special Elite", "Courier New", Courier, monospace;
    font-size: 1.0625rem;
    line-height: 1.75;
  }
  main {
    max-width: 36rem;
    margin: 0 auto;
    padding: 6rem 1.5rem 3rem;
  }
  header h1 {
    font-weight: normal;
    font-size: 2.2rem;
    line-height: 1.2;
    margin: 0 0 0.4rem;
  }
  header p { margin: 0; }
  .rule {
    width: 3rem;
    height: 1px;
    background: #000;
    border: 0;
    margin: 2.75rem 0;
  }
  h2 {
    font-weight: normal;
    font-size: 0.9rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin: 0 0 0.75rem;
  }
  section { margin-bottom: 2.75rem; }
  section p { margin: 0 0 1rem; }
  a {
    color: #000;
    text-decoration: underline;
    text-underline-offset: 0.2em;
  }
  a:hover, a:focus { text-decoration-thickness: 2px; }
  .placeholder {
    background: #e8e8e8;
    padding: 0 0.25em;
  }
  footer {
    border-top: 1px solid #000;
    margin-top: 3.5rem;
    padding-top: 1.25rem;
    font-size: 0.85rem;
  }
  @media (max-width: 480px) {
    body { font-size: 1rem; }
    main { padding-top: 3.5rem; }
    header h1 { font-size: 1.85rem; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Neil C. Burton</h1>
    <p>Southern literary fiction</p>
  </header>

  <hr class="rule">

  <section id="about">
    <h2>About</h2>
    <p>Neil C. Burton is a teacher in Tennessee, where he teaches Career Exploration and Computer Science to middle schoolers. He writes Southern literary fiction.</p>
  </section>

  <section id="novel">
    <h2>The Novel</h2>
    <p><em>Longwood</em></p>
  </section>

  <section id="contact">
    <h2>Contact</h2>
    <p>Write to me at <a href="mailto:neil@neilcburton.com">neil@neilcburton.com</a>.</p>
    <!-- X link removed for now; may add later: https://x.com/neilcburton -->
  </section>

  <footer>
    &copy; 2026 Neil C. Burton
  </footer>
</main>
</body>
</html>
